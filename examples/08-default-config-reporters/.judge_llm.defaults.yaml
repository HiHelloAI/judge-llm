# Complete Default Configuration Example
# 
# This demonstrates registering ALL custom components (providers, evaluators, reporters)
# in your defaults so they can be used by name in test configs.
#
# Place this file in your project root as .judge_llm.defaults.yaml
# or in ~/.judge_llm/defaults.yaml

# ============================================================================
# PROVIDERS - Register custom providers
# ============================================================================
providers:
  # Example: Register a custom provider (if you had one)
  # - type: custom
  #   module_path: ./providers/my_provider.py
  #   class_name: MyCustomProvider
  #   register_as: my_provider
  
# ============================================================================
# EVALUATORS - Register custom evaluators  
# ============================================================================
evaluators:
  # Built-in evaluators (always available)
  - type: response_evaluator
    enabled: true
    config:
      similarity_threshold: 0.8
      
  - type: cost_evaluator
    enabled: true
    config:
      max_cost_per_case: 0.10
      
  # Register custom evaluators
  # - type: custom
  #   module_path: ./evaluators/safety_evaluator.py
  #   class_name: SafetyEvaluator
  #   register_as: safety
  
  # - type: custom
  #   module_path: ./evaluators/compliance_evaluator.py
  #   class_name: ComplianceEvaluator
  #   register_as: compliance

# ============================================================================
# REPORTERS - Register custom reporters
# ============================================================================
reporters:
  # Register custom CSV reporter
  - type: custom
    module_path: ./reporters/csv_reporter.py
    class_name: CSVReporter
    register_as: csv  # ← Now you can use "type: csv" in test configs!
    
  # Register custom Slack reporter
  - type: custom
    module_path: ./reporters/slack_reporter.py
    class_name: SlackReporter
    register_as: slack  # ← Now you can use "type: slack" in test configs!
    
  # Register custom metrics reporter
  - type: custom
    module_path: ./reporters/metrics_reporter.py
    class_name: MetricsReporter
    register_as: metrics  # ← Now you can use "type: metrics" in test configs!

# ============================================================================
# AGENT - Default agent settings
# ============================================================================
agent:
  log_level: INFO
  num_runs: 1
  parallel_execution: false
  max_workers: 4

# ============================================================================
# NOTES
# ============================================================================
# 
# Benefits of registering in defaults:
# 
# 1. DRY - Register once, use everywhere by name
# 2. Team standardization - Everyone uses same components
# 3. Clean test configs - Just reference by name
# 4. Easy updates - Change implementation in one place
#
# Usage in test configs:
#
#   providers:
#     - type: my_provider  # Uses registered custom provider
#       agent_id: test
#
#   evaluators:
#     - type: safety  # Uses registered custom evaluator
#     - type: compliance
#
#   reporters:
#     - type: csv  # Uses registered custom reporter
#     - type: slack
#     - type: metrics
#
