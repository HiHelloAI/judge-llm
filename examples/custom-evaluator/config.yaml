agent:
  log_level: INFO
  num_runs: 1
  parallel_execution: false
  max_workers: 4

dataset:
  loader: local_file
  paths:
    - ./sample.evalset.json

providers:
  - type: mock
    agent_id: news_agent
    model: mock-model-v1

evaluators:
  # Built-in evaluators
  - type: response_validator
    enabled: true
    config:
      similarity_threshold: 0.8
      match_type: exact

  # Custom evaluator loaded from Python file
  - type: custom
    module_path: ./evaluators/sentiment_evaluator.py
    class_name: SentimentEvaluator
    enabled: true
    config:
      min_positive_sentiment: 0.3

reporters:
  - type: console
