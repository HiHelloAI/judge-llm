# Full Configuration - All Settings Explicitly Defined
# This config does not rely on defaults

agent:
  num_runs: 1
  parallel_execution: false
  max_workers: 4
  fail_on_threshold_violation: true
  validate_config: true
  log_level: INFO

dataset:
  loader: json
  paths:
    - sample.evalset.json

providers:
  - type: gemini
    agent_id: news_agent
    agent_config_path: agent_config.json

evaluators:
  - type: llm_grader
    name: response_quality
    threshold: 0.7
    enabled: true
    config:
      model: gemini-2.0-flash-exp
      criteria:
        - accuracy
        - completeness
        - clarity

  - type: exact_match
    name: exact_response_match
    enabled: true

reporters:
  - type: console

  - type: html
    output_path: reports/report.html

  - type: json
    output_path: reports/report.json
