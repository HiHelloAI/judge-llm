agent:
  log_level: INFO
  num_runs: 2  # Run each case twice
  parallel_execution: true
  max_workers: 4

dataset:
  loader: local_file
  paths:
    - ./sample.evalset.json

providers:
  - type: mock
    agent_id: news_agent
    model: mock-model-v1
    temperature: 0.7

evaluators:
  - type: response_validator
    enabled: true
    config:
      similarity_threshold: 0.8
      match_type: exact

  - type: trajectory_validator
    enabled: true
    config:
      sequence_match_type: exact

  - type: cost_evaluator
    enabled: true
    config:
      max_cost_per_case: 0.10

  - type: latency_evaluator
    enabled: true
    config:
      max_latency_seconds: 30

reporters:
  - type: console
  - type: html
    output_path: ./report.html
  - type: json
    output_path: ./report.json
