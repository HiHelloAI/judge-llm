# Test configuration for database reporter

agent:
  name: test_db_agent
  description: "Test agent for database reporter"

dataset:
  loader: local_file
  paths:
    - ./test.evalset.json

providers:
  - type: gemini
    agent_id: test_db_agent
    model: gemini-2.0-flash-exp
    temperature: 0.7

evaluators:
  - type: response_evaluator
    enabled: false

reporters:
  - type: console

  - type: database
    db_path: ./test_results.db
